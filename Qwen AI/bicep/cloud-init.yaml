```yaml
#cloud-config

package_update: true

packages:
  - curl
  - ca-certificates
  - jq
  - xfsprogs
  - zstd
  - python3.11
  - python3.11-pip

write_files:
  - path: /usr/local/sbin/setupQwen.sh
    owner: root:root
    permissions: '0750'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      echo "Starting Qwen AI VM setup..."

      # --------------------------------------------------
      # 1. Mount persistent Azure data disk
      # --------------------------------------------------

      DEVICE=/dev/disk/azure/scsi1/lun0
      DATA_DIR=/mnt/ai-data

      echo "Waiting for persistent data disk..."

      for i in $(seq 1 60); do
        if [ -b "$DEVICE" ]; then
          break
        fi
        sleep 5
      done

      if [ ! -b "$DEVICE" ]; then
        echo "ERROR: Persistent data disk not found: $DEVICE"
        exit 1
      fi

      echo "Data disk found: $DEVICE"

      mkdir -p "$DATA_DIR"

      # Only format the disk if it has no filesystem.
      # This preserves the disk contents when the VM is rebuilt.
      if ! blkid "$DEVICE" >/dev/null 2>&1; then
        echo "Formatting data disk as XFS..."
        mkfs.xfs "$DEVICE"
      else
        echo "Existing filesystem detected on data disk."
      fi

      DISK_UUID=$(blkid -s UUID -o value "$DEVICE")

      if ! grep -q "$DISK_UUID" /etc/fstab; then
        echo "UUID=$DISK_UUID $DATA_DIR xfs defaults,nofail 0 2" \
          >> /etc/fstab
      fi

      if ! mountpoint -q "$DATA_DIR"; then
        echo "Mounting data disk..."
        mount "$DATA_DIR"
      else
        echo "Data disk already mounted."
      fi

      mkdir -p "$DATA_DIR/ollama"
      mkdir -p "$DATA_DIR/open-webui"

      echo "Persistent AI data directory ready: $DATA_DIR"

      # --------------------------------------------------
      # 2. Install Ollama
      # --------------------------------------------------

      echo "Checking Ollama installation..."

      if ! command -v ollama >/dev/null 2>&1; then

        echo "Installing Ollama..."

        curl -fsSL https://ollama.com/install.sh \
          -o /tmp/ollama-install.sh

        sh /tmp/ollama-install.sh

        rm -f /tmp/ollama-install.sh

      else
        echo "Ollama is already installed."
      fi

      # --------------------------------------------------
      # 3. Configure Ollama model storage
      # --------------------------------------------------

      echo "Configuring Ollama model storage..."

      mkdir -p /etc/systemd/system/ollama.service.d

      cat > /etc/systemd/system/ollama.service.d/storage.conf <<'EOF'
      [Service]
      Environment="OLLAMA_MODELS=/mnt/ai-data/ollama"
      EOF

      systemctl daemon-reload

      # --------------------------------------------------
      # 4. Start Ollama
      # --------------------------------------------------

      echo "Starting Ollama..."

      systemctl enable ollama
      systemctl start ollama

      echo "Checking Ollama service..."

      if ! systemctl is-active --quiet ollama; then
        echo "ERROR: Ollama service failed to start."

        echo "----- systemctl status ollama -----"
        systemctl status ollama --no-pager -l || true

        echo "----- journalctl -u ollama -----"
        journalctl -u ollama --no-pager -n 100 || true

        exit 1
      fi

      echo "Ollama service is running."

      # --------------------------------------------------
      # 5. Wait for Ollama API
      # --------------------------------------------------

      echo "Waiting for Ollama API..."

      for i in $(seq 1 60); do

        if curl -fsS \
          http://127.0.0.1:11434/api/tags \
          >/dev/null; then

          echo "Ollama API is ready."
          break
        fi

        sleep 2

      done

      if ! curl -fsS \
        http://127.0.0.1:11434/api/tags \
        >/dev/null; then

        echo "ERROR: Ollama API did not become available."

        echo "----- systemctl status ollama -----"
        systemctl status ollama --no-pager -l || true

        echo "----- journalctl -u ollama -----"
        journalctl -u ollama --no-pager -n 100 || true

        exit 1
      fi

      # --------------------------------------------------
      # 6. Download Qwen 2.5 3B
      # --------------------------------------------------

      echo "Checking Qwen 2.5 3B model..."

      if ollama list | grep -q 'qwen2.5:3b'; then

        echo "Qwen 2.5 3B is already installed."

      else

        echo "Downloading Qwen 2.5 3B..."

        ollama pull qwen2.5:3b

      fi

      # --------------------------------------------------
      # 7. Install Open WebUI
      # --------------------------------------------------

      echo "Checking Open WebUI installation..."

      if [ ! -x /opt/open-webui-venv/bin/open-webui ]; then

        echo "Creating Open WebUI Python environment..."

        python3.11 -m venv /opt/open-webui-venv

        /opt/open-webui-venv/bin/python \
          -m pip install --upgrade pip

        echo "Installing Open WebUI..."

        /opt/open-webui-venv/bin/python \
          -m pip install open-webui

      else

        echo "Open WebUI is already installed."

      fi

      # --------------------------------------------------
      # 8. Configure Open WebUI
      # --------------------------------------------------

      echo "Configuring Open WebUI..."

      cat > /etc/systemd/system/open-webui.service <<'EOF'
      [Unit]
      Description=Open WebUI
      After=network-online.target ollama.service
      Wants=network-online.target

      [Service]
      Type=simple

      Environment="OLLAMA_BASE_URL=http://127.0.0.1:11434"
      Environment="DATA_DIR=/mnt/ai-data/open-webui"
      Environment="HOST=127.0.0.1"
      Environment="PORT=8080"

      ExecStart=/opt/open-webui-venv/bin/open-webui serve

      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
      EOF

      systemctl daemon-reload
      systemctl enable --now open-webui

      # --------------------------------------------------
      # 9. Install Tailscale
      # --------------------------------------------------

      echo "Checking Tailscale installation..."

      if ! command -v tailscale >/dev/null 2>&1; then

        echo "Installing Tailscale..."

        curl -fsSL https://tailscale.com/install.sh \
          -o /tmp/tailscale-install.sh

        sh /tmp/tailscale-install.sh

        rm -f /tmp/tailscale-install.sh

      else

        echo "Tailscale is already installed."

      fi

      systemctl enable --now tailscaled

      # --------------------------------------------------
      # 10. Finish
      # --------------------------------------------------

      echo ""
      echo "=============================================="
      echo "AI software installation completed."
      echo "=============================================="
      echo ""
      echo "Ollama:"
      echo "  API: http://127.0.0.1:11434"
      echo "  Models: /mnt/ai-data/ollama"
      echo ""
      echo "Open WebUI:"
      echo "  Local: http://127.0.0.1:8080"
      echo "  Data: /mnt/ai-data/open-webui"
      echo ""
      echo "Qwen:"
      echo "  qwen2.5:3b"
      echo ""
      echo "Tailscale:"
      echo "  Authenticate manually with:"
      echo "  sudo tailscale up"
      echo ""
      echo "Then configure Tailscale Funnel for Open WebUI."
      echo ""

runcmd:
  - [bash, -lc, "/usr/local/sbin/setupQwen.sh"]
```

This keeps **one setup script** and doesn't introduce another custom systemd service. The existing `ollama.service` and `open-webui.service` are still used because those applications need to stay running after the setup script exits.

The key change for your current failure is that if Ollama doesn't start, you'll now get the **actual `systemctl status` and `journalctl` output** instead of five minutes of `curl: connection refused`.
