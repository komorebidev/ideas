<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Lab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">Test Lab</h3>
                    </div>
                    <div class="card-body">
                        
                        {% if message %}
                            <div class="alert alert-success" role="alert">{{ message }}</div>
                        {% endif %}
                        
                        {% if error %}
                            <div class="alert alert-danger" role="alert">{{ error }}</div>
                        {% endif %}

                        <h4 class="card-title">Virtual Machine: <span class="text-secondary">{{ vm_name }}</span></h4>
                        <p class="card-text fs-5">
                            <strong>Status:</strong> 
                            <span class="badge {% if vm_status == 'VM running' %}bg-success{% else %}bg-secondary{% endif %}">
                                {{ vm_status }}
                            </span>
                        </p>

                        <hr>

                        <!-- Connection & Credentials Section -->
                        <div class="card bg-light mb-4">
                            <div class="card-body">
                                <h5 class="card-title">Access Details</h5>
                                <p class="mb-2"><strong>IP:</strong> <code>{{ vm_ip }}</code></p>
                                <p class="mb-1"><strong>User:</strong> <code>{{ vm_username }}</code></p>
                                <p class="mb-0"><strong>Password:</strong> <code>{{ vm_password }}</code></p>
                            </div>
                        </div>

                        <!-- Actions Form -->
                        <form method="POST" class="d-flex gap-3">
                            <button type="submit" name="action" value="start" class="btn btn-success flex-grow-1">Start</button>
                            <button type="submit" name="action" value="stop" class="btn btn-danger flex-grow-1">Stop / Deallocate</button>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
